[project]
name = "dashboard"
version = "0.1.0"
description = "Owner dashboard (variance, grab clips, confirm flagged grabs) + Excel auto-fill. Contract: app/contracts.py"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
